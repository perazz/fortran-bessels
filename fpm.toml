name        = "fortran-bessels"
author      = "Federico Perini"
copyright   = "Copyright (c) 2022-2026, Federico Perini" 
version     = "0.1.0"
license     = "MIT"
description = "Fortran Bessels library" 
homepage    = "https://github.com/perazz/fortran-bessels"
keywords    = ["math","bessel","bessel functions","special functions"]

[build]
auto-executables = false
auto-examples    = false
auto-tests       = true
module-naming    = "bessels"

[library]
source-dir  = "src"
include-dir = "src"

[install]
library = true

[[test]]
name="bessels_tests"
source-dir="test"
main="bessels_test.f90"

# Documentation helper (dumps x,f(x) CSV for the accuracy plots; see doc/README.md)
[[example]]
name="dump_values"
source-dir="example"
main="dump_values.f90"

